name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Rules engine, headless client and multiplayer suites
        run: npm test
      - name: Static bundle builds
        run: node tools/build-static.js

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t belote-royale .
      - name: Container serves the game
        run: |
          docker run -d --name belote -p 3000:3000 belote-royale
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health && break || sleep 1
          done
          curl -fsS http://localhost:3000/ | grep -q "BELOTE"
          docker rm -f belote
