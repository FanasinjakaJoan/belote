name: Build Android app

# Wraps the static bundle with Capacitor and produces an installable APK.
# Download it from the workflow run's Artifacts section.
on:
  workflow_dispatch:
    inputs:
      server:
        description: 'Multiplayer server URL (optional — solo play needs none)'
        required: false
        default: ''
  release:
    types: [published]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3

      - name: Build the web bundle
        run: node tools/build-static.js --server "${{ inputs.server || vars.BELOTE_SERVER }}"

      - name: Add Capacitor and the Android platform
        run: |
          npm ci
          npm i -D @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: belote-royale-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Assemble unsigned release AAB (Play Store)
        run: ./gradlew bundleRelease --no-daemon
        working-directory: android
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: belote-royale-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
