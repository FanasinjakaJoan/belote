name: Deploy web app (GitHub Pages)

# Publishes the installable PWA. Solo vs AI runs fully offline in the browser;
# online tables use the server at BELOTE_SERVER (repository variable) if set.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      server:
        description: 'Multiplayer server URL (optional, e.g. https://belote.fly.dev)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build static bundle
        run: node tools/build-static.js --server "${{ inputs.server || vars.BELOTE_SERVER }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
