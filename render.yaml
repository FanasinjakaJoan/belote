# Render.com blueprint — https://render.com/docs/blueprint-spec
# Deploy: push this repo, then New ▸ Blueprint on Render and pick it.
services:
  - type: web
    name: belote-royale
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
